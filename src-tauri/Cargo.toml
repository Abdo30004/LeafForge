[package]
name = "leafforge"
version = "0.6.7"
description = "LeafForge — Local-First Collaborative LaTeX Desktop IDE"
authors = ["LeafForge Team"]
edition = "2024"

[lib]
name = "leafforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
notify = "6"
notify-debouncer-full = "0.3"
rfd = "0.15"
flate2 = "1.0"
blake3 = "1.5"
fontdb = "0.21"
regex = "1.11"
walkdir = "2"
git2 = { version = "0.19", features = ["vendored-libgit2", "https"] }
keyring = "3"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
