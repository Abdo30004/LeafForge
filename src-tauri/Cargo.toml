[package]
name = "leafforge"
version = "0.1.0"
description = "LeafForge — Local-First Collaborative LaTeX Desktop IDE"
authors = ["LeafForge Team"]
edition = "2024"

[lib]
name = "leafforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
notify = "6"
notify-debouncer-full = "0.3"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
