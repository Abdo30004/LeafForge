name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop application & create GitHub release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LeafForge ${{ github.ref_name }}'
          releaseBody: |
            ## LeafForge ${{ github.ref_name }} — Local-First Collaborative LaTeX Desktop Studio
            
            ### Release Assets:
            - **Windows:** `.msi` (WiX Installer) & `.exe` (NSIS Setup)
            - **macOS:** `.dmg` (Apple Silicon & Intel Universal)
            - **Linux:** `.AppImage` & `.deb`

            ### Key Features:
            - Dual-Mode CodeMirror 6 BiDi / Visual WYSIWYM Editor
            - First-Class Arabic/Hebrew BiDi (UAX #9) with LTR command isolation
            - Hybrid Compiler Pool (Tectonic Auto-CTAN + TeX Live) with sub-second preamble caching
            - Native SyncTeX two-way forward/inverse navigation
            - Native `libgit2` Git engine with OS Keychain token integration
            - E2EE Yjs real-time collaboration with designated committer election & 3-way reconciliation
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
